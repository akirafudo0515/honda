<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>特約商店後台</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet" />
      <link rel="stylesheet" href="admin.css?v=20260812d" />
</head>
<body>
  <div id="app">
    <section id="login-view" class="card login-card">
      <h1>特約商店後台</h1>
      <p class="muted">請輸入管理密碼</p>
      <form id="login-form">
        <label>
          密碼
          <input type="password" id="password" autocomplete="current-password" required />
        </label>
        <button type="submit">登入</button>
        <p id="login-error" class="error" hidden></p>
      </form>
    </section>

    <section id="admin-view" hidden>
      <header class="topbar">
        <div>
          <h1>後台管理</h1>
          <p class="muted">店家與專屬活動內容維護</p>
        </div>
        <button type="button" id="logout-btn" class="secondary">登出</button>
      </header>

      <nav class="tabs" aria-label="後台分頁">
        <button type="button" class="tab is-active" data-tab="stores">店家管理</button>
        <button type="button" class="tab" data-tab="events">專屬活動</button>
      </nav>

      <div id="status" class="status" hidden></div>

      <!-- STORES -->
      <div id="tab-stores" class="tab-panel">
        <div class="toolbar card">
          <label>
            分類篩選
            <select id="filter-category">
              <option value="">全部</option>
              <option value="dining">餐飲相關特約店家</option>
              <option value="cafe">咖啡 · 點心 · 甜品類</option>
              <option value="hotel">旅館民宿特約店家</option>
              <option value="souvenir">伴手禮/觀光工廠特約店家</option>
              <option value="leisure">生活休閒類特約店家</option>
              <option value="shopping">生活服務及購物</option>
            </select>
          </label>
          <button type="button" id="new-btn">＋ 新增店家</button>
        </div>

        <div class="layout">
          <div class="card list-card">
            <div id="store-table-wrap">
              <table id="store-table">
                <thead>
                  <tr>
                    <th>排序</th>
                    <th>店名</th>
                    <th>分類</th>
                    <th>顯示</th>
                    <th></th>
                  </tr>
                </thead>
                <tbody id="store-tbody"></tbody>
              </table>
            </div>
          </div>

          <form id="editor" class="card editor-card" hidden>
            <h2 id="editor-title">新增店家</h2>
            <input type="hidden" id="store-id" />

            <label>
              分類 *
              <select id="f-category" required>
                <option value="dining">餐飲相關特約店家</option>
                <option value="cafe">咖啡 · 點心 · 甜品類</option>
                <option value="hotel">旅館民宿特約店家</option>
                <option value="souvenir">伴手禮/觀光工廠特約店家</option>
                <option value="leisure">生活休閒類特約店家</option>
                <option value="shopping">生活服務及購物</option>
              </select>
            </label>

            <label>
              店名 *
              <input id="f-name" required maxlength="200" />
            </label>

            <label>
              地址
              <input id="f-address" maxlength="300" />
            </label>

            <div class="row">
              <label>
                電話
                <input id="f-phone" maxlength="100" />
              </label>
              <label>
                營業時間
                <input id="f-hours" maxlength="200" />
              </label>
            </div>

            <label>
              交通
              <input id="f-transport" maxlength="300" />
            </label>

            <label>
              服務項目
              <input id="f-services" maxlength="300" />
            </label>

            <label>
              介紹
              <textarea id="f-description" rows="5"></textarea>
            </label>

            <label>
              優惠內容
              <textarea id="f-discount" rows="3"></textarea>
            </label>

            <label>
              備註
              <input id="f-notes" maxlength="300" />
            </label>

            <label>
              官網連結
              <input id="f-website" type="url" placeholder="https://" />
            </label>

            <div class="row">
              <label>
                排序（數字越小越前面；空白＝排最後）
                <input id="f-sort" type="number" placeholder="空白＝最後" />
              </label>
              <label>
                前台狀態
                <select id="f-visible">
                  <option value="1">顯示</option>
                  <option value="0">不顯示</option>
                </select>
              </label>
            </div>

            <div class="upload-block">
              <label>
                店家圖片（可多選，最多 12 張）
                <input id="f-image-file" type="file" accept="image/*" multiple />
              </label>
              <input id="f-image-urls" type="hidden" value="[]" />
              <div id="image-preview" class="preview image-gallery"></div>
            </div>

            <div class="upload-block">
              <label>
                PDF 附件
                <input id="f-pdf-file" type="file" accept="application/pdf" />
              </label>
              <input id="f-pdf-url" type="hidden" />
              <input id="f-pdf-name" type="hidden" />
              <div id="pdf-preview" class="preview"></div>
            </div>

            <div class="actions">
              <button type="submit">儲存</button>
              <button type="button" id="cancel-btn" class="secondary">取消</button>
              <button type="button" id="delete-btn" class="danger" hidden>刪除</button>
            </div>
          </form>
        </div>
      </div>

      <!-- EVENTS -->
      <div id="tab-events" class="tab-panel" hidden>
        <div class="toolbar card">
          <p class="muted" style="margin:0">管理前台「專屬活動」頁面內容。目前資料庫若尚無活動，請按「新增活動」或儲存下方表單。</p>
          <button type="button" id="new-event-btn">＋ 新增活動</button>
        </div>

        <div id="events-empty-hint" class="card" style="margin-bottom:16px;padding:16px 20px" hidden>
          <p style="margin:0;color:#6b7280;font-size:14px">尚無活動資料。右側表單填寫標題與內容後按「儲存」，即可顯示於前台專屬活動頁。</p>
        </div>

        <div class="layout event-admin-layout">
          <div class="card list-card">
            <table id="event-table">
              <thead>
                <tr>
                  <th>排序</th>
                  <th>標題</th>
                  <th>顯示</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="event-tbody"></tbody>
            </table>
          </div>

          <div class="event-editor-wrap">
            <div class="card event-preview-card">
              <p class="event-preview-label">前台預覽（與專屬活動頁相同版型）</p>
              <article id="event-live-preview" class="admin-event-card" aria-live="polite">
                <div class="event-copy">
                  <span class="event-index">EVENT 01</span>
                  <h3 class="event-title">活動標題預覽</h3>
                  <div class="event-body">活動內容會顯示在這裡…</div>
                </div>
                <div class="event-media">
                  <div class="event-media-empty">尚未上傳圖片</div>
                </div>
              </article>
            </div>

            <form id="event-editor" class="card editor-card" hidden>
            <h2 id="event-editor-title">新增活動</h2>
            <input type="hidden" id="event-id" />

            <label>
              活動標題 *
              <input id="e-title" required maxlength="300" />
            </label>

            <label>
              活動內容
              <textarea id="e-body" rows="10" placeholder="可換行，會依段落顯示在前台"></textarea>
            </label>

            <label>
              連結網址（點圖片或「了解更多」時開啟）
              <input id="e-link" type="url" placeholder="https://" />
            </label>

            <div class="row">
              <label>
                排序（數字越小越前面；空白＝排最後）
                <input id="e-sort" type="number" placeholder="空白＝最後" />
              </label>
              <label>
                前台狀態
                <select id="e-visible">
                  <option value="1">顯示</option>
                  <option value="0">不顯示</option>
                </select>
              </label>
            </div>

            <div class="upload-block">
              <label>
                活動圖片
                <input id="e-image-file" type="file" accept="image/*" />
              </label>
              <input id="e-image-url" type="hidden" />
              <div id="event-image-preview" class="preview"></div>
            </div>

            <div class="actions">
              <button type="submit">儲存</button>
              <button type="button" id="event-cancel-btn" class="secondary">取消</button>
              <button type="button" id="event-delete-btn" class="danger" hidden>刪除</button>
            </div>
          </form>
        </div>
      </div>
    </section>
  </div>
  <script src="admin.js?v=20260812d"></script>
</body>
</html>
