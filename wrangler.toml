name = "honda"
compatibility_date = "2025-01-01"
pages_build_output_dir = "htjwc.weebly.com"

# After `npm run db:create`, replace database_id with the real UUID from Cloudflare.
[[d1_databases]]
binding = "DB"
database_name = "honda-stores"
database_id = "d91d37ea-1735-4473-8df4-afece17b5cd8"

[[r2_buckets]]
